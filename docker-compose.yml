services:

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    
    environment:
      MONGO_URI: mongodb://mongodb:27017/chat-app
      REDIS_URL: redis://redis:6379

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  mongo_data:
  uploads_data: